<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F2EB">
<title>השבוע בעגלה</title>
<link rel="icon" href="../cafe/img/logo.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="קורטדו">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="panel.css">
<script type="module" src="panel.js"></script>
</head>
<body>
<div id="signin" class="signin" hidden>
  <img src="../cafe/img/logo.png" alt="קפה קורטדו" width="96" height="96">
  <h1>השבוע בעגלה</h1>
  <button id="signin-btn" class="btn primary" type="button">כניסה עם Google</button>
  <p id="signin-error" class="error" role="alert"></p>
</div>

<div id="app" class="app" hidden>
  <h1 class="sr">השבוע בעגלה</h1>
  <header class="top">
    <img src="../cafe/img/logo.png" alt="קפה קורטדו" width="40" height="40">
    <h2 id="view-title" class="view-title" hidden></h2>
    <div class="weeks" role="tablist" aria-label="שבוע">
      <button role="tab" id="tab-cur" data-week="cur" type="button"></button>
      <button role="tab" id="tab-next" data-week="next" type="button"></button>
    </div>
    <button id="signout" class="icon-btn" type="button" aria-label="יציאה">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></svg>
    </button>
  </header>

  <main id="v-hours" class="view">
    <section class="status" id="status" aria-live="polite"></section>
    <div class="tools">
      <button id="paste-open" class="btn" type="button">הדבקת סידור</button>
      <button id="copy-prev" class="btn ghost" type="button">שכפול שבוע קודם</button>
    </div>
    <div id="days" class="days"></div>
  </main>

  <main id="v-queue" class="view" hidden>
    <button id="stop-auto" class="btn ghost wide" type="button">עצירת כל הרילים והפוסטים האוטומטיים</button>
    <div id="queue" class="queue"></div>
  </main>

  <main id="v-more" class="view" hidden>
    <section class="card">
      <h3>שעות</h3>
      <div class="actions">
        <button class="btn" type="button" data-do="refresh">רענון השעות בפייסבוק עכשיו</button>
        <button class="btn" type="button" data-do="undo">חזרה לגרסה הקודמת</button>
        <button class="btn" type="button" data-do="cancel_week" id="cancel-week" hidden>ביטול הפרסום המתוזמן</button>
      </div>
    </section>
    <section class="card">
      <h3>צוות</h3>
      <div id="team" class="rows"></div>
      <form id="team-add" class="add-row">
        <input name="name" placeholder="שם…" autocomplete="off" aria-label="שם" required>
        <input name="phone" placeholder="טלפון…" inputmode="tel" autocomplete="off" aria-label="טלפון" dir="ltr">
        <button class="btn" type="submit">הוספה</button>
      </form>
    </section>
    <section class="card">
      <h3>תזכורות</h3>
      <div id="reminders" class="rows"></div>
      <form id="remind-add" class="add-row">
        <input name="text" placeholder="על מה להזכיר…" autocomplete="off" aria-label="על מה להזכיר" required>
        <input name="at" type="datetime-local" aria-label="מתי" required>
        <button class="btn" type="submit">הוספה</button>
      </form>
    </section>
    <section class="card">
      <h3>רשימות</h3>
      <div id="lists" class="rows"></div>
      <form id="list-add" class="add-row">
        <input name="list" placeholder="רשימה…" list="list-names" autocomplete="off" aria-label="שם הרשימה" required>
        <input name="text" placeholder="מה להוסיף…" autocomplete="off" aria-label="פריט" required>
        <button class="btn" type="submit">הוספה</button>
        <datalist id="list-names"></datalist>
      </form>
    </section>
    <section class="card">
      <h3>מידע</h3>
      <div class="actions">
        <button class="btn" type="button" data-info="brief">בריף להיום</button>
        <button class="btn" type="button" data-info="stats">איך הלכו הפוסטים</button>
        <button class="btn" type="button" data-info="status">מצב המערכת</button>
      </div>
    </section>
    <section class="card" id="install-card" hidden>
      <h3>התקנה בטלפון</h3>
      <button id="install-btn" class="btn primary wide" type="button" hidden>התקנה</button>
      <p id="install-ios" hidden>בספארי: כפתור השיתוף ← "הוספה למסך הבית"</p>
    </section>
  </main>

  <footer class="bar">
    <button id="preview-btn" class="btn primary wide" type="button">תצוגה לפני פרסום</button>
    <nav class="nav" aria-label="מסכים">
      <button type="button" data-view="hours" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></svg>שעות</button>
      <button type="button" data-view="queue"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>בתור</button>
      <button type="button" data-view="more"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>עוד</button>
    </nav>
  </footer>
</div>

<dialog id="paste" class="sheet">
  <form method="dialog" class="sheet-body">
    <h2>הדבקת סידור</h2>
    <textarea id="paste-text" rows="10" dir="rtl" autocomplete="off" spellcheck="false" placeholder="שני 17:00–19:00 נוגה&#10;שלישי 9:00–13:00 אלה, ליה&#10;ראשון ורביעי סגור"></textarea>
    <p id="paste-skipped" class="warn-text"></p>
    <div class="row">
      <button class="btn ghost" value="cancel" type="submit">ביטול</button>
      <button id="paste-fill" class="btn primary" value="fill" type="submit">מילוי הטבלה</button>
    </div>
  </form>
</dialog>

<dialog id="preview" class="sheet">
  <div class="sheet-body">
    <div class="seg" role="tablist" aria-label="תצוגה">
      <button role="tab" data-view="public" aria-selected="true" type="button">לקוחות</button>
      <button role="tab" data-view="team" aria-selected="false" type="button">צוות</button>
    </div>
    <div id="pv-public" class="board"></div>
    <pre id="pv-team" class="team-text" hidden></pre>
    <ul id="pv-checks" class="checks"></ul>
    <div class="row">
      <button id="pv-close" class="btn ghost" type="button">חזרה לעריכה</button>
      <button id="publish-btn" class="btn primary" type="button"></button>
    </div>
    <div class="row sched">
      <input id="sched-time" inputmode="numeric" maxlength="5" value="20:00" autocomplete="off" dir="ltr" aria-label="שעת פרסום">
      <button id="sched-btn" class="btn" type="button">פרסום בשעה הזאת</button>
    </div>
  </div>
</dialog>

<dialog id="result" class="sheet">
  <div class="sheet-body">
    <h2 id="rs-title"></h2>
    <ul id="rs-channels" class="channels"></ul>
    <div id="rs-actions" class="actions"></div>
    <div class="row">
      <button id="rs-close" class="btn primary wide" type="button">סגירה</button>
    </div>
  </div>
</dialog>

<dialog id="info" class="sheet">
  <div class="sheet-body">
    <h2 id="info-title"></h2>
    <pre id="info-text" class="team-text"></pre>
    <button id="info-close" class="btn primary wide" type="button">סגירה</button>
  </div>
</dialog>

<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
