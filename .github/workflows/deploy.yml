# Auto-deploy: every push to main deploys the site and Firestore rules to Firebase.
name: Deploy to Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # שער: דחיפה ל-main נפרסת לאוויר מיד. בדיקה שנופלת עוצרת כאן,
      # לפני שהיא מגיעה למנהלת ולעובדים.
      - name: Install test deps
        run: npm install --no-save playwright http-server && npx playwright install --with-deps chromium
      - name: Run tests
        run: node tests/run.mjs
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Write service account
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      # Storage לא נפרס בכוונה — הפרויקט על תוכנית Spark. ראה CLAUDE.md §2.
      - name: Deploy hosting + Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: firebase deploy --only hosting,firestore:rules --project cortado-ops --non-interactive
