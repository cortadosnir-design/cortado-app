<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="size" content="1080x1350">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="board.css">
<!-- Election-day carousel 24.10.2026: one feed page per partner, the 64-partner-story layout at 4:5.
     Data: window.HOURS.partner = {name, line, photo, pos?, icon?}. Paths relative to this file. -->
<style>
.doodles{opacity:.55}
.badge{top:34px}
.fl{position:absolute;left:216px;top:176px;width:648px;height:590px;border:12px solid var(--foam);border-radius:30px;overflow:hidden;
  background:#fff;transform:rotate(-1.5deg);box-shadow:0 22px 50px rgba(0,0,0,.4)}
.fl img{display:block;width:100%;height:100%;object-fit:cover}
.sticker{right:58px;top:250px;width:172px;height:172px;font-size:30px;transform:rotate(10deg);box-shadow:0 12px 26px rgba(0,0,0,.35)}
.card{left:112px;right:112px;top:800px;height:290px;text-align:center;padding-top:30px}
.card .k{color:#A9592F;font-weight:700;font-size:34px}
.card .n{font-weight:900;font-size:124px;line-height:1.08;color:var(--cart);white-space:nowrap;overflow:hidden;padding:0 30px}
.card .l{font-size:36px;color:var(--espresso)}
.ic{position:absolute;left:84px;top:766px;width:96px;height:96px;border-radius:50%;background:var(--aida);display:flex;align-items:center;justify-content:center;z-index:3;
  box-shadow:0 10px 22px rgba(0,0,0,.3)}
.ic img{width:62px;height:62px}
.ic[hidden]{display:none}
.ribbon{top:1124px;font-size:44px}
.foot{bottom:50px}
</style></head><body class="board-bg">
<img class="doodles" src="../assets/art/doodles-post.svg" alt="">
<div class="badge"><img src="../assets/logo.png" alt=""><span>cortado</span></div>
<div class="fl"><img id="photo" alt=""></div>
<div class="sticker"><span>שותפים<br>ליום<br>הבוחר</span></div>
<div class="card"><div class="k">השותפים שלנו ליום הבוחר</div><div class="n" id="name"></div><div class="l" id="line"></div></div>
<div class="ribbon">נתראה בעגלה ביום הבוחר</div>
<div class="foot">קיבוץ שניר · שלישי <span class="t">27.10</span> · על הדשא ליד המרכולית</div>
<script>
const p = (window.HOURS || {}).partner || {};
const ph = document.getElementById("photo");
ph.src = p.photo || "";
if (p.pos) ph.style.objectPosition = p.pos;
const n = document.getElementById("name");
n.textContent = p.name || "";
document.fonts.ready.then(() => { for (let f = 120; n.scrollWidth > n.clientWidth && f >= 64; f -= 4) n.style.fontSize = f + "px"; });
document.getElementById("line").textContent = p.line || "";
</script>
</body></html>
