<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
/* Option 2 — dusk: Hermon at last light, the falls among the trees, the cart glowing, cups in front */
body{background:#0F1712;font-family:Heebo;color:#F6EEDB;position:relative}
.hermon{position:absolute;top:0;left:0;width:1080px;height:700px;object-position:50% 20%;filter:sepia(.45) saturate(1.3) hue-rotate(-12deg) brightness(.72) contrast(1.15)}
.eve{position:absolute;top:420px;left:0;width:1080px;height:930px;object-position:78% 50%;
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 22%)}
.falls{position:absolute;top:470px;left:0;width:470px;height:600px;object-position:28% 45%;filter:brightness(.62) saturate(.9);
  -webkit-mask-image:linear-gradient(90deg,#000 45%,transparent 100%),linear-gradient(180deg,transparent 0%,#000 25%,#000 70%,transparent 100%);-webkit-mask-composite:source-in}
.cupsbox{position:absolute;left:40px;bottom:0;width:560px;height:380px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 18%,#000 80%,transparent 100%),linear-gradient(180deg,transparent 0%,#000 35%);-webkit-mask-composite:source-in}
.cupsbox img{width:100%;height:100%;object-fit:cover;object-position:50% 96%;filter:brightness(.85)}
.shade{position:absolute;left:0;right:0;bottom:0;height:520px;background:linear-gradient(180deg,rgba(15,23,18,0),rgba(15,23,18,.85) 55%)}
h1{position:absolute;top:70px;right:72px;font-size:112px;line-height:.95;color:#FFF5E0}
.sub{position:absolute;top:300px;right:76px;font-size:26px;font-weight:300}
.logo{position:absolute;left:72px;top:72px;width:150px;height:150px;box-shadow:0 0 0 3px #F6EEDB,0 8px 24px rgba(0,0,0,.4)}
.hours{position:absolute;right:72px;bottom:72px;width:430px}
.wk{font-size:21px;opacity:.8;margin-bottom:6px}
.row{display:flex;justify-content:space-between;padding:11px 0;border-top:1.5px solid rgba(246,238,219,.3);font-size:30px;font-weight:300}
.row b{font-weight:500}
.credit{position:absolute;left:14px;top:10px;font-size:13px;opacity:.55;direction:ltr}
</style></head><body>
<img class="hermon cover" src="../assets/photos/hermon.jpg" alt="">
<img class="eve cover" src="../assets/photos/evening.jpg" alt="">
<img class="falls cover" src="../assets/photos/banias.jpg" alt="">
<div class="shade"></div>
<div class="cupsbox"><img src="../assets/photos/hero.jpg" alt=""></div>
<h1>ערב על<br>הדשא</h1>
<div class="sub">8 דקות הליכה מהבניאס, מול החרמון</div>
<img class="logo" src="../assets/logo.png" alt="">
<div class="hours"><div class="wk" data-week>השעות לשבוע {week}</div><div data-hours="a" data-group="1"></div></div>
<div class="credit">Hermon photo: Jotpe, CC BY-SA 4.0</div>
<template id="row-a"><div class="row"><b>{day}</b><span>{times}</span></div></template>
<script src="hours.js"></script>
</body></html>
