<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="size" content="1080x1920">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="board.css">
<!-- One fixed story for the "שעות פעילות" highlight (19.10.2026): Instagram can't add to highlights automatically,
     so the highlight links to the landing page, whose hours update themselves every week.
     The owner adds an Instagram link sticker on the empty zone under the arrow:
     https://cortadosnir-design.github.io/cortado-app/cafe/#visit -->
<style>
html,body{width:1080px;height:1920px;overflow:hidden}
.doodles{height:1920px}
.badge{top:200px}
.card{left:90px;right:90px;top:300px;height:760px}
.h{position:absolute;top:420px;left:0;right:0;text-align:center;font-weight:900;font-size:150px;line-height:.95;color:var(--cart);letter-spacing:-1px}
.k{position:absolute;top:760px;left:140px;right:140px;text-align:center;font-weight:600;font-size:48px;line-height:1.25;color:var(--aida-dark)}
.ribbon{top:1010px;font-size:54px}
.tap{position:absolute;top:1170px;left:0;right:0;text-align:center;color:var(--chalk);font-weight:700;font-size:46px}
.arrow{position:absolute;top:1240px;left:50%;margin-left:-40px;width:80px;height:150px}
.arrow path{fill:none;stroke:var(--aida-light);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.foot{bottom:260px;font-size:30px}
</style></head><body class="board-bg">
<img class="doodles" src="../assets/art/doodles-story.svg" alt="">
<div class="card"></div>
<div class="badge"><img src="../assets/logo.png" alt=""><span>cortado</span></div>
<div class="h">השעות<br>של השבוע</div>
<div class="k">תמיד מעודכנות באתר שלנו,<br>כל שבוע מחדש</div>
<img class="heart" src="../assets/art/icon-heart-pink.svg" style="right:120px;top:350px;width:80px;height:80px;transform:rotate(14deg)" alt="">
<div class="ribbon">נתראה בעגלה</div>
<div class="tap">לחצו על הקישור</div>
<svg class="arrow" viewBox="0 0 80 150"><path d="M40 6 C 30 50, 52 90, 40 136 M16 112 L40 140 L64 112"/></svg>
<div class="foot">קיבוץ שניר · על הדשא ליד המרכולית</div>
</body></html>
