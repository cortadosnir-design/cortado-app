<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="size" content="1080x1920">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="board.css">
<!-- All election-day partners in one story 9:16 (owner, 22.10.2026), the evening before 27.10.
     Data: window.HOURS.all = {tiles:[{photo, name, what}], date, hours, more, title?, ribbon?, hearts?}. Paths relative to this file. Safe zone y 250–1670. -->
<style>
#hearts[hidden]{display:none}
html,body{height:1920px}
.doodles{opacity:.5}
.badge{top:256px}
.t{position:absolute;top:372px;left:0;right:0;text-align:center;font-weight:900;font-size:62px;color:var(--chalk);line-height:1}
.grid{position:absolute;top:452px;left:54px;right:54px;display:flex;flex-wrap:wrap;justify-content:center;row-gap:10px}
.tile{width:33.33%}
.tile{text-align:center}
.tile .ph{width:156px;height:156px;margin:0 auto;border-radius:50%;overflow:hidden;border:7px solid var(--foam);box-shadow:0 10px 22px rgba(0,0,0,.35);background:#fff}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile b{display:block;margin-top:6px;font-weight:800;font-size:30px;color:var(--chalk);line-height:1.05;white-space:nowrap}
.tile small{display:block;font-weight:500;font-size:23px;color:var(--aida-light);line-height:1.2;white-space:nowrap}
.card{left:70px;right:70px;top:1222px;height:236px;text-align:center;padding-top:18px}
.card .d{font-weight:800;font-size:38px;color:#A9592F}
.card .h{direction:ltr;font-weight:900;font-size:92px;line-height:1.05;color:var(--cart)}
.card .m{font-weight:600;font-size:29px;color:var(--espresso)}
.ribbon{top:1478px;font-size:44px}
.socials{top:1566px;bottom:auto}
.foot.r{top:1612px;bottom:auto}
</style></head><body class="board-bg">
<img class="doodles" src="../assets/art/doodles-story.svg" alt="">
<div class="badge"><img src="../assets/logo.png" alt=""><span>cortado</span></div>
<div class="t" id="title">השותפים שלנו ליום הבוחר</div>
<div class="grid" id="grid"></div>
<div class="card"><div class="d" id="date"></div><div class="h" id="hours"></div><div class="m" id="more"></div></div>
<div class="ribbon" id="ribbon">נתראה מחר על הדשא</div>
<div id="hearts" hidden><img class="heart" src="../assets/art/icon-heart-pink.svg" style="left:92px;top:1196px;width:74px;height:74px;transform:rotate(-14deg)" alt=""><img class="heart" src="../assets/art/icon-heart-pink.svg" style="right:96px;top:1420px;width:58px;height:58px;transform:rotate(12deg)" alt=""><img class="heart" src="../assets/art/icon-heart-pink.svg" style="right:150px;top:356px;width:50px;height:50px;transform:rotate(18deg)" alt=""></div>
<div class="socials"><div class="s"><span class="q"><img src="../assets/qr-instagram.svg" alt="QR לאינסטגרם"></span><span>אינסטגרם</span></div><div class="s"><span class="q"><img src="../assets/qr-facebook.svg" alt="QR לפייסבוק"></span><span>פייסבוק</span></div><div class="s"><span class="q"><img src="../assets/qr-whatsapp.svg" alt="QR לקבוצת הוואטסאפ"></span><span>וואטסאפ</span></div></div>
<div class="foot r">קיבוץ שניר · על הדשא ליד המרכולית</div>
<script>
const a = (window.HOURS || {}).all || {};
for (const t of a.tiles || []) {
  const d = document.createElement("div"); d.className = "tile";
  d.innerHTML = '<div class="ph"><img alt=""></div><b></b><small></small>';
  d.querySelector("img").src = t.photo; d.querySelector("b").textContent = t.name; d.querySelector("small").textContent = t.what;
  document.getElementById("grid").append(d);
}
document.getElementById("date").textContent = a.date || "";
if (a.title) document.getElementById("title").textContent = a.title;   // the thank-you version (owner, 22.10.2026)
if (a.ribbon) document.getElementById("ribbon").textContent = a.ribbon;
if (a.hearts) document.getElementById("hearts").hidden = false;
document.getElementById("hours").textContent = a.hours || "";
document.getElementById("more").textContent = a.more || "";
</script>
</body></html>
