<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="size" content="1080x1920">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="board.css">
<!-- Weekly hours story with one event day highlighted (24.10.2026, election-day week).
     Safe zone y 250–1670. The cart is the hero (owner: "show the cart, not the lawn").
     A day with "mark" in hours.json gets the terracotta row; "detail" is one short line under it. -->
<style>
html,body{width:1080px;height:1920px;overflow:hidden}
.doodles{height:1920px;opacity:.55}
.fest{opacity:1}
.badge{top:250px}
.pic{position:absolute;left:90px;right:90px;top:376px;height:380px;border-radius:40px;border:8px solid var(--foam);overflow:hidden;
  box-shadow:0 22px 50px rgba(0,0,0,.35);z-index:2}
.pic img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.sticker{left:40px;top:318px;width:176px;height:176px;font-size:27px;transform:rotate(-9deg)}
.card{left:90px;right:90px;top:784px;height:722px}
.head{position:absolute;top:812px;left:0;right:0;font-size:104px;z-index:3}
.kicker{position:absolute;top:914px;left:0;right:0;font-size:40px;z-index:3}
.list{position:absolute;top:1010px;left:150px;right:150px;z-index:3}
.row{display:flex;align-items:center;gap:20px;height:56px;border-bottom:1.5px solid rgba(20,20,23,.12)}
.row:last-child{border-bottom:0}
.row b{font-weight:600;font-size:34px;flex:1}
.row span{font-weight:500;font-size:33px;color:var(--espresso)}
.row.ev{flex-wrap:wrap;height:auto;margin:6px -26px;padding:12px 26px 14px;border:0;border-radius:28px;background:var(--aida);color:var(--foam);row-gap:4px}
.row.ev .dayc{background:var(--cart)}
.row.ev b{font-weight:800}
.row.ev span{color:var(--foam);font-weight:800;font-size:36px}
.row.ev i{flex-basis:100%;padding-right:74px;font-style:normal;font-weight:600;font-size:27px;line-height:1.25}
.row.ev + .row{border-top:0}
.row.ev i span{font-size:inherit;font-weight:inherit}
.ribbon{top:1478px;font-size:46px}
.socials{left:64px;bottom:auto;top:1578px}
.socials .q img{width:64px;height:64px}
.foot.r{right:64px;bottom:auto;top:1610px;font-size:27px}
</style></head><body class="board-bg">
<img class="doodles" src="../assets/art/doodles-story.svg" alt="">
<img class="doodles fest" src="../assets/art/festive-story.svg" alt="">
<div class="badge"><img src="../assets/logo.png" alt=""><span>cortado</span></div>
<div class="pic"><img src="../assets/photos/cart.jpg" alt=""></div>
<div class="sticker" data-sticker></div>
<div class="card"></div>
<div class="head">השבוע בעגלה</div>
<div class="kicker" data-week>{week}</div>
<div class="list" data-hours="a"></div>
<div class="ribbon">נתראה בעגלה</div>
<div class="socials"><div class="s"><span class="q"><img src="../assets/qr-instagram.svg" alt="QR לאינסטגרם"></span><span>אינסטגרם</span></div><div class="s"><span class="q"><img src="../assets/qr-facebook.svg" alt="QR לפייסבוק"></span><span>פייסבוק</span></div><div class="s"><span class="q"><img src="../assets/qr-whatsapp.svg" alt="QR לקבוצת הוואטסאפ"></span><span>וואטסאפ</span></div></div>
<div class="foot r">קיבוץ שניר · העגלה ליד המרכולית</div>
<template id="row-a"><div class="row"><div class="dayc">{short}</div><b>{day}</b><span>{times}</span></div></template>
<script src="hours.js"></script>
<script>
(function () {
  const H = window.HOURS; if (!H) return;
  const rows = document.querySelectorAll('[data-hours="a"] .row');
  H.days.forEach((d, i) => {
    if (!d.mark) return;
    const r = rows[i]; r.classList.add("ev");
    r.querySelector("b").textContent = d.day + " · " + d.mark;
    if (d.detail) r.insertAdjacentHTML("beforeend", `<i>${d.detail}</i>`);
  });
  document.querySelector("[data-sticker]").innerHTML = H.sticker || "";
  if (!H.sticker) document.querySelector("[data-sticker]").remove();
})();
</script>
</body></html>
