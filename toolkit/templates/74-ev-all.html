<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="size" content="1080x1350">
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="board.css">
<!-- Election-day carousel 24.10.2026, last page: 65-partners-all-story at 4:5.
     Data: window.HOURS.all = {tiles:[{photo, name, what}], date, hours, more}. -->
<style>
.doodles{opacity:.5}
.badge{top:30px}
.t{position:absolute;top:140px;left:0;right:0;text-align:center;font-weight:900;font-size:60px;color:var(--chalk);line-height:1}
.grid{position:absolute;top:218px;left:70px;right:70px;display:flex;flex-wrap:wrap;justify-content:center;row-gap:8px}
.tile{width:33.33%;text-align:center}
.tile .ph{width:142px;height:142px;margin:0 auto;border-radius:50%;overflow:hidden;border:7px solid var(--foam);box-shadow:0 10px 22px rgba(0,0,0,.35);background:#fff}
.tile .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tile b{display:block;margin-top:6px;font-weight:800;font-size:29px;color:var(--chalk);line-height:1.05;white-space:nowrap}
.tile small{display:block;font-weight:500;font-size:22px;color:var(--aida-light);line-height:1.2;white-space:nowrap}
.card{left:90px;right:90px;top:892px;height:200px;text-align:center;padding-top:14px}
.card .d{font-weight:800;font-size:36px;color:#A9592F}
.card .h{direction:ltr;font-weight:900;font-size:84px;line-height:1.05;color:var(--cart)}
.card .m{font-weight:600;font-size:27px;color:var(--espresso)}
.ribbon{top:1118px;font-size:44px}
.foot.r2{position:absolute;left:auto;text-align:right;right:44px;bottom:40px;color:var(--chalk);font-size:25px;opacity:.92}
</style></head><body class="board-bg">
<img class="doodles" src="../assets/art/doodles-post.svg" alt="">
<div class="badge"><img src="../assets/logo.png" alt=""><span>cortado</span></div>
<div class="t">השותפים שלנו ליום הבוחר</div>
<div class="grid" id="grid"></div>
<div class="card"><div class="d" id="date"></div><div class="h" id="hours"></div><div class="m" id="more"></div></div>
<img class="heart" src="../assets/art/icon-heart-pink.svg" style="left:110px;top:866px;width:70px;height:70px;transform:rotate(-14deg)" alt="">
<div class="ribbon">נתראה בעגלה</div>
<div class="socials"><div class="s"><span class="q"><img src="../assets/qr-instagram.svg" alt="QR לאינסטגרם"></span><span>אינסטגרם</span></div><div class="s"><span class="q"><img src="../assets/qr-facebook.svg" alt="QR לפייסבוק"></span><span>פייסבוק</span></div><div class="s"><span class="q"><img src="../assets/qr-whatsapp.svg" alt="QR לקבוצת הוואטסאפ"></span><span>וואטסאפ</span></div></div>
<div class="foot r2">קיבוץ שניר · על הדשא ליד המרכולית</div>
<script>
const a = (window.HOURS || {}).all || {};
for (const t of a.tiles || []) {
  const d = document.createElement("div"); d.className = "tile";
  d.innerHTML = '<div class="ph"><img alt=""></div><b></b><small></small>';
  d.querySelector("img").src = t.photo; d.querySelector("b").textContent = t.name; d.querySelector("small").textContent = t.what;
  document.getElementById("grid").append(d);
}
document.getElementById("date").textContent = a.date || "";
document.getElementById("hours").textContent = a.hours || "";
document.getElementById("more").textContent = a.more || "";
</script>
</body></html>
