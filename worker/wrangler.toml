# Cloudflare Worker "cortado-api" - deployed by .github/workflows/worker.yml
name = "cortado-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Vars and secrets stay as set in the Cloudflare dashboard
# (FIREBASE_PROJECT_ID, ALLOWED_ORIGINS, FB_PAGE_*, IG_USER_ID, FIREBASE_SA, BOT_KEY, GB_*).
# Deploys from here replace only the code.
keep_vars = true

# הקרון: כל עשר דקות מפרסם לאינסטגרם את מה שהגיע זמנו (publishDue ב-index.js).
# דורש את הסוד FIREBASE_SA בלוח של Cloudflare — ראה worker/README.md.
[triggers]
crons = ["*/10 * * * *"]
