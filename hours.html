<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>שעות הפעילות – קפה קורטדו</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap">
<style>
body{margin:0;background:#F1F2EE;color:#1D1B18;font-family:"Assistant",system-ui,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.card{background:#fff;border:1px solid #D5D7CF;border-radius:16px;padding:20px 22px;max-width:420px;width:100%}
h1{font-family:"Secular One",sans-serif;font-weight:400;font-size:24px;margin:0 0 4px}
.sub{color:#66625B;font-size:14px;margin:0 0 14px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:17px}
dt{font-weight:700}dd{margin:0;font-variant-numeric:tabular-nums}
dd.closed{color:#66625B}
.foot{margin-top:14px;font-size:12px;color:#66625B}
</style>
</head>
<body>
<div class="card">
  <h1>☕ קפה קורטדו</h1>
  <p class="sub" id="sub">שעות הפעילות השבוע</p>
  <dl id="hours"><dt>טוען…</dt><dd></dd></dl>
  <p class="foot">קיבוץ שניר · מתעדכן אוטומטית מלוח המשמרות</p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";
import { firebaseConfig } from "./config.js";
const DAYS = { sun:"ראשון", mon:"שני", tue:"שלישי", wed:"רביעי", thu:"חמישי", fri:"שישי", sat:"שבת" };
const db = getFirestore(initializeApp(firebaseConfig));
onSnapshot(doc(db, "public", "hours"), snap => {
  const dl = document.getElementById("hours"); dl.replaceChildren();
  if (!snap.exists()){ dl.innerHTML = "<dt>השעות יפורסמו בקרוב</dt><dd></dd>"; return; }
  const h = snap.data().hours || {};
  for (const k of Object.keys(DAYS)){
    const r = (h[k] || []).map(x => x.join("–")).join(", ");
    const dt = document.createElement("dt"); dt.textContent = DAYS[k];
    const dd = document.createElement("dd"); dd.textContent = r || "סגור"; if (!r) dd.className = "closed";
    dl.append(dt, dd);
  }
}, () => { document.getElementById("hours").innerHTML = "<dt>לא הצלחנו לטעון</dt><dd></dd>"; });
</script>
</body>
</html>
