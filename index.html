<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C5A87">
<title>משמרות קורטדו</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%95%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="eyebrow">עגלת קפה קורטדו</div>
      <h1>משמרות</h1>
    </div>
    <div class="who" id="who" hidden>
      <img id="avatar" alt="" width="32" height="32">
      <div>
        <div id="myName" class="nm"></div>
        <button class="link" id="signOut">יציאה</button>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="card center" id="signin">
      <h2>ברוכים הבאים</h2>
      <p>כניסה עם חשבון גוגל כדי לראות את המשמרות ולהשתבץ.</p>
      <button class="primary big" id="signInBtn">כניסה עם גוגל</button>
      <p class="small" id="authNote"></p>
    </section>

    <section id="board" hidden>
      <div class="weeknav">
        <button id="prevWeek" aria-label="שבוע קודם">→</button>
        <div class="range" id="range">…</div>
        <button id="nextWeek" aria-label="שבוע הבא">←</button>
        <span class="pill" id="weekState"></span>
      </div>
      <div id="summary" class="summary"></div>
      <div id="notice"></div>
      <div class="days" id="days"></div>
    </section>

    <section class="card" id="managerPanel" hidden>
      <h2>ניהול השבוע</h2>
      <div class="form">
        <label for="fDay">יום<select id="fDay"></select></label>
        <label for="fStart">משעה<input id="fStart" type="time" value="06:30"></label>
        <label for="fEnd">עד<input id="fEnd" type="time" value="11:00"></label>
        <label for="fNeed">אנשים<input id="fNeed" type="number" min="1" max="6" value="1"></label>
        <button class="primary" id="addShift">הוסף משמרת</button>
      </div>
      <div class="actions">
        <button id="copyPrev">העתק משבוע שעבר</button>
        <button class="primary" id="toggleOpen">פתח לשיבוץ</button>
      </div>
      <div id="managerStatus" class="status" role="status"></div>
      <details>
        <summary>שעות פתיחה מחושבות</summary>
        <dl class="hours" id="hours"></dl>
        <button id="copyHours">העתק טקסט לפרסום</button>
      </details>
    </section>
  </main>

  <footer class="foot">
    <span id="conn" class="small"></span>
    <span class="small">קפה קורטדו · קיבוץ שניר</span>
  </footer>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
